<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>news-digest · DB schema</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/elkjs@0.9/lib/elk.bundled.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <strong>news-digest</strong> <span>DB schema</span>
      </div>
      <input
        id="search"
        type="search"
        placeholder="Find a table or column…  (/)"
        autocomplete="off"
      />
      <div class="seg" id="mode" role="group" aria-label="Detail">
        <button data-mode="tables">Tables</button>
        <button data-mode="keys">Keys</button>
        <button data-mode="all">All columns</button>
      </div>
      <button id="fit" title="Fit to screen (F)">Fit</button>
      <a class="navlink" href="../docs/">Docs</a>
      <a class="navlink" href="../">App</a>
      <span id="stamp" class="muted"></span>
      <button id="warn" class="warn" hidden></button>
    </header>
    <div id="warnings" class="warnings" hidden></div>
    <main>
      <aside id="legend" class="legend"></aside>
      <div id="canvas" class="canvas">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker
              id="arrow-fk"
              viewBox="0 0 10 10"
              refX="9"
              refY="5"
              markerWidth="7"
              markerHeight="7"
              orient="auto-start-reverse"
            >
              <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
            </marker>
            <marker
              id="arrow-implicit"
              viewBox="0 0 10 10"
              refX="9"
              refY="5"
              markerWidth="7"
              markerHeight="7"
              orient="auto-start-reverse"
            >
              <path d="M0,0 L10,5 L0,10 z" fill="#a855f7" />
            </marker>
          </defs>
          <g id="viewport"></g>
        </svg>
        <div id="status" class="status">Loading schema…</div>
      </div>
      <aside id="panel" class="panel" hidden></aside>
    </main>
  </body>
</html>
