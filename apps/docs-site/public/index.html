<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>news-digest docs</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="top">
      <button id="menu" class="icon" aria-label="Toggle navigation">☰</button>
      <a class="brand" href="#/"
        ><strong>news-digest</strong> <span>docs</span></a
      >
      <button id="search" class="search" type="button" aria-haspopup="dialog">
        <span>Search docs…</span> <kbd id="search-key">⌘K</kbd>
      </button>
      <nav class="links">
        <a href="../">App</a>
        <a href="../db/">DB schema</a>
        <a
          href="https://github.com/EmmadUsmani/news-digest"
          target="_blank"
          rel="noopener"
          >GitHub ↗</a
        >
      </nav>
    </header>
    <div class="layout">
      <nav id="sidebar" class="sidebar"></nav>
      <main>
        <article id="content" class="content">Loading…</article>
        <footer id="pager" class="pager"></footer>
      </main>
      <aside id="toc" class="toc"></aside>
    </div>
    <dialog id="palette" class="palette" aria-label="Search and go to">
      <input
        id="palette-input"
        type="text"
        role="combobox"
        aria-expanded="true"
        aria-controls="palette-list"
        aria-autocomplete="list"
        placeholder="Search the handbook or jump to a page"
        autocomplete="off"
        spellcheck="false"
      />
      <div id="palette-list" class="palette-list" role="listbox"></div>
      <footer class="palette-help">
        <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>esc</kbd> close</span>
      </footer>
    </dialog>
  </body>
</html>
