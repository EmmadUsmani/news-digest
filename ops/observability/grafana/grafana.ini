[server]
http_addr = 127.0.0.1
http_port = 3001
root_url = https://news-digest.exe.xyz/grafana/
serve_from_sub_path = true
[paths]
data = /var/lib/news-digest-grafana
logs = /var/lib/news-digest-grafana/logs
plugins = /var/lib/news-digest-grafana/plugins
provisioning = /etc/news-digest-observability/grafana/provisioning
[auth]
disable_login_form = true
[auth.anonymous]
enabled = true
org_role = Viewer
[users]
allow_sign_up = false
[security]
disable_initial_admin_creation = true
cookie_secure = true
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[news]
news_feed_enabled = false
[plugins]
public_key_retrieval_disabled = true
preinstall_disabled = true
preinstall_auto_update = false
plugin_admin_enabled = false
[unified_alerting]
enabled = false
[log]
mode = console
level = warn
[live]
max_connections = 0

[cloud_migration]
enabled = false

# Read-only, provisioned dashboards do not use snapshots or the Kubernetes UI.
[snapshots]
enabled = false
external_enabled = false
[feature_toggles]
kubernetesDashboards = false
[dashboard_cleanup]
interval = 1h
[unified_storage]
index_workers = 1
index_rebuild_workers = 1
index_cache_ttl = 1m
