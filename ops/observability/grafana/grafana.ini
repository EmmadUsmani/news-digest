[server]
http_addr = 127.0.0.1
http_port = 3001
root_url = https://news-digest.exe.xyz/grafana/
serve_from_sub_path = true
[paths]
data = /var/lib/news-digest-grafana
logs = /var/lib/news-digest-grafana/logs
plugins = /var/lib/news-digest-grafana/plugins
provisioning = /etc/news-digest-observability/grafana/provisioning
[auth]
disable_login_form = true
[auth.anonymous]
enabled = true
org_role = Viewer
[users]
allow_sign_up = false
[security]
disable_initial_admin_creation = true
cookie_secure = true
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[news]
news_feed_enabled = false
[plugins]
public_key_retrieval_disabled = true
preinstall_disabled = true
preinstall_auto_update = false
plugin_admin_enabled = false
[unified_alerting]
enabled = false
[log]
mode = console
level = warn
[live]
max_connections = 0

[cloud_migration]
enabled = false
