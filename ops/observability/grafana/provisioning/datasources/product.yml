apiVersion: 1
datasources:
  - name: Product (read only)
    uid: product-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: 127.0.0.1:5432
    user: grafana_product
    editable: false
    jsonData:
      database: news_digest
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 300
      timescaledb: false
