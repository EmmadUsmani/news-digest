[SERVICE]
    Flush 2
    Grace 1
    Log_Level warn
    Parsers_File /etc/news-digest-observability/parsers.conf
    storage.path /var/lib/news-digest-log-shipper/buffer
    storage.max_chunks_up 8
    storage.backlog.mem_limit 4M

[INPUT]
    Name systemd
    Tag journal
    Systemd_Filter _SYSTEMD_USER_UNIT=news-digest-api.service
    Systemd_Filter _SYSTEMD_USER_UNIT=news-digest-worker.service
    Systemd_Filter _SYSTEMD_USER_UNIT=news-digest-docs.service
    Systemd_Filter _SYSTEMD_USER_UNIT=news-digest-schema.service
    Systemd_Filter_Type Or
    DB /var/lib/news-digest-log-shipper/journal.db
    Read_From_Tail Off
    Mem_Buf_Limit 4M
    storage.type filesystem
    storage.pause_on_chunks_overlimit On

[INPUT]
    Name tail
    Tag supervisor
    Path /home/exedev/agent-control/logs/supervisor.log
    DB /var/lib/news-digest-log-shipper/supervisor.db
    Read_From_Head On
    Rotate_Wait 30
    Skip_Long_Lines On
    Buffer_Max_Size 128K
    Mem_Buf_Limit 2M
    storage.type filesystem
    storage.pause_on_chunks_overlimit On

# Container inputs are generated by install.sh from the two compose services.
@INCLUDE /etc/news-digest-observability/containers.conf

[FILTER]
    Name parser
    Match journal
    Key_Name MESSAGE
    Parser pino
    Reserve_Data On
    Preserve_Key On

[FILTER]
    Name lua
    Match *
    Script /etc/news-digest-observability/normalize.lua
    Call normalize

[OUTPUT]
    Name http
    Match *
    Host 127.0.0.1
    Port 9428
    URI /logs/insert/jsonline?_stream_fields=service,source&_msg_field=log&_time_field=date
    Format json_lines
    Json_Date_Format iso8601
    Retry_Limit False
    storage.total_limit_size 32M
