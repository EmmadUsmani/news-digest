news_digest_schedule:
  query: |
    SELECT coalesce((SELECT CASE WHEN state IN ('pending','running','retrying','failed')
      THEN greatest(0, extract(epoch FROM (now() - scheduled_at))) ELSE 0 END
      FROM scheduled_ai_budget_days
      WHERE scheduled_at <= now() AND scheduled_at > now() - interval '48 hours'
      ORDER BY scheduled_at DESC LIMIT 1), 0)::double precision AS unsettled_seconds,
      coalesce((SELECT extract(epoch FROM max(scheduled_at)) FROM scheduled_ai_budget_days
        WHERE scheduled_at <= now()), 0)::double precision AS latest_due_timestamp_seconds
  metrics:
    - unsettled_seconds:
        usage: GAUGE
        description: Age of latest due unresolved or failed scheduled lifecycle within 48 hours; zero if succeeded or absent
    - latest_due_timestamp_seconds:
        usage: GAUGE
        description: Latest due durable schedule timestamp across all states; zero without a due record
news_digest_provider:
  query: |
    WITH providers(provider) AS (VALUES ('anthropic'), ('xai')),
    periods(period, boundary) AS (
      VALUES ('daily', date_trunc('day', now() AT TIME ZONE 'UTC') AT TIME ZONE 'UTC'),
             ('monthly', date_trunc('month', now() AT TIME ZONE 'UTC') AT TIME ZONE 'UTC')
    ), calls AS (
      SELECT 'anthropic' AS provider, created_at, status, cost_micros, reserved_micros FROM llm_calls
      UNION ALL
      SELECT 'xai', created_at, status, cost_micros, reserved_micros FROM x_discovery_calls
    )
    SELECT providers.provider, periods.period,
      (coalesce(sum(cost_micros) FILTER (WHERE created_at >= boundary), 0)
       + coalesce(sum(reserved_micros) FILTER (WHERE status IN ('pending','uncertain')), 0))
       / 1000000.0 AS committed_usd
    FROM providers CROSS JOIN periods LEFT JOIN calls USING (provider)
    GROUP BY providers.provider, periods.period
  metrics:
    - provider:
        usage: LABEL
        description: Provider ledger
    - period:
        usage: LABEL
        description: UTC accounting period
    - committed_usd:
        usage: GAUGE
        description: UTC settled spend plus all outstanding holds, including older unresolved calls

news_digest_bluesky:
  query: |
    SELECT editing_failed, no_pick_chances FROM bluesky_edition_alert_metrics
  metrics:
    - editing_failed:
        usage: GAUGE
        description: Latest eligible scheduled edition has failed or missing Bluesky evidence
    - no_pick_chances:
        usage: GAUGE
        description: Scheduled editions with an open Bluesky slot and no pick since the last pick
