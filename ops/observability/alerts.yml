groups:
  - name: host-and-services
    interval: 30s
    rules:
      - alert: DiskSpaceLow
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs"} / node_filesystem_size_bytes) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Filesystem exceeds 80 percent used
      - alert: ServiceDown
        expr: news_digest_unit_active == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Monitored app or observability unit is inactive
      - alert: GrafanaHealthFailed
        expr: (news_digest_grafana_health_success == 0) or absent(news_digest_grafana_health_success)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Grafana health endpoint failed or timed out
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Metrics scrape target is unavailable
      - alert: DatabaseBackupStale
        expr: (time() - news_digest_database_backup_success_timestamp_seconds > 93600) or absent(news_digest_database_backup_success_timestamp_seconds)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: No successful database backup in the last 26 hours
      - alert: OffsiteDatabaseBackupStale
        expr: (time() - news_digest_offsite_database_success_timestamp_seconds > 93600) or absent(news_digest_offsite_database_success_timestamp_seconds)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: No successful B2 database upload in 26 hours
      - alert: OffsiteVmBackupStale
        expr: (time() - news_digest_offsite_vm_success_timestamp_seconds > 691200) or absent(news_digest_offsite_vm_success_timestamp_seconds)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: No successful B2 VM bundle upload in 8 days
      - alert: OffsiteBackupFailed
        expr: news_digest_offsite_last_attempt_success == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: B2 backup attempt failed or storage admission refused
      - alert: OffsiteBackupStorageWarning
        expr: (news_digest_offsite_bucket_bytes > 2000000000) or (news_digest_offsite_projected_60d_bytes > 3000000000)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: B2 bucket exceeds 2 GB or projects exceeding 3 GB within 60 days
      - alert: UnitSnapshotStale
        expr: (time() - news_digest_unit_snapshot_timestamp_seconds > 120) or absent(news_digest_unit_snapshot_timestamp_seconds)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Service collector snapshot is stale or missing
      - alert: HostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host available memory is below 10 percent
      - alert: ObservabilityMemoryBudget
        expr: (news_digest_unit_memory_bytes{scope="system",unit=~"obs-.*"} / news_digest_unit_memory_limit_bytes{scope="system",unit=~"obs-.*"} > 0.9) and (news_digest_unit_memory_limit_bytes > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Observability service exceeds 90 percent of its configured memory ceiling
  - name: app-outcomes
    interval: 30s
    rules:
      - alert: BlueskyEditingFailed
        expr: news_digest_bluesky_editing_failed == 1
        labels:
          severity: warning
        annotations:
          summary: Latest scheduled edition has failed or missing Bluesky editing results
      - alert: BlueskyNoPicks
        expr: news_digest_bluesky_no_pick_chances >= 3
        labels:
          severity: warning
        annotations:
          summary: Three scheduled Bluesky opportunities passed without a pick
      - alert: RecentJobFailures
        expr: sum by (queue) (increase_prometheus(news_digest_job_duration_seconds_count{job="app-worker",outcome="failed"}[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Worker recorded failed attempts in the last ten minutes
      - alert: ApiServerErrorRate
        expr: (sum(increase_prometheus(news_digest_http_request_duration_seconds_count{job="app-api",status=~"5.."}[5m])) / sum(increase_prometheus(news_digest_http_request_duration_seconds_count{job="app-api"}[5m])) > 0.05) and (sum(increase_prometheus(news_digest_http_request_duration_seconds_count{job="app-api"}[5m])) >= 20)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: API 5xx responses exceed five percent with at least twenty requests in five minutes
      # The offset retains a pre-run observation after BullMQ advances its next time.
      # Persist observed due times so a missing lifecycle remains visible for 48 hours.
      - record: news_digest_schedule_observed_due_timestamp_seconds
        expr: max(news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",queue="digest-generation"} offset 20m <= time() - 900 and news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",queue="digest-generation"} offset 20m > 0) or vector(0)
      - alert: ScheduledLifecycleMissing
        expr: max(max_over_time(news_digest_schedule_observed_due_timestamp_seconds[48h])) > on () max(news_digest_schedule_latest_due_timestamp_seconds)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Observed digest due time has no matching or newer durable lifecycle record
      - alert: ScheduledEditionUnsettled
        expr: news_digest_schedule_unsettled_seconds > 900
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Latest due scheduled lifecycle is unresolved or failed more than fifteen minutes after its scheduled time
      - alert: ProviderSpendNearCap
        expr: (news_digest_provider_committed_usd / on (provider, period) max by (provider, period) (news_digest_provider_configured_ceiling_usd) >= 0.9) and on (provider, period) (max by (provider, period) (news_digest_provider_configured_ceiling_usd) > 0)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Provider UTC spend and outstanding holds reach 90 percent of the configured cap
      - alert: DigestScheduleUnavailable
        expr: (news_digest_queue_schedulers{job="app-api",queue="digest-generation"} == 0) or (news_digest_queue_paused{job="app-api",queue="digest-generation"} == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Daily digest queue has no registered schedule or is paused
      - alert: DigestScheduleStalled
        expr: (time() - news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",queue="digest-generation"} > 900) and (news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",queue="digest-generation"} > 0)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Daily digest scheduler next run remains more than fifteen minutes overdue
      - alert: DigestScheduleMetricsMissing
        expr: (up{job="app-api"} == 1) unless on (job, instance) (news_digest_queue_schedulers{job="app-api",queue="digest-generation"} and news_digest_queue_paused{job="app-api",queue="digest-generation"} and news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",queue="digest-generation"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: API scrape succeeds but digest scheduling metrics are incomplete
