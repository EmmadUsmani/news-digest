global:
  scrape_interval: 30s
  scrape_timeout: 10s
scrape_configs:
  - job_name: app-api
    static_configs:
      - targets: ['127.0.0.1:9464']
  - job_name: app-worker
    static_configs:
      - targets: ['127.0.0.1:9465']
  - job_name: app-docs
    static_configs:
      - targets: ['127.0.0.1:9466']
  - job_name: app-schema
    static_configs:
      - targets: ['127.0.0.1:9467']
  - job_name: host
    static_configs:
      - targets: ['127.0.0.1:9100']
  - job_name: metrics-store
    metrics_path: /metrics/metrics
    static_configs:
      - targets: ['127.0.0.1:8428']
