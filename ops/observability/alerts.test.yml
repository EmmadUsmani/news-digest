rule_files:
  - alerts.yml
evaluation_interval: 30s
tests:
  - name: disk threshold and sustained duration
    interval: 30s
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/",device="root"}'
        values: '20 19 19 19 19 19 30'
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/",device="root"}'
        values: '100 100 100 100 100 100 100'
    alert_rule_test:
      - eval_time: 0m
        alertname: DiskSpaceLow
        groupname: host-and-services
        exp_alerts: []
      - eval_time: 2m
        alertname: DiskSpaceLow
        groupname: host-and-services
        exp_alerts: []
      - eval_time: 2m30s
        alertname: DiskSpaceLow
        groupname: host-and-services
        exp_alerts:
          - exp_labels:
              fstype: ext4
              mountpoint: /
              device: root
              severity: warning
              alertgroup: host-and-services
            exp_annotations:
              summary: Filesystem exceeds 80 percent used
      - eval_time: 3m
        alertname: DiskSpaceLow
        groupname: host-and-services
        exp_alerts: []
  - name: job counter increase persists then expires
    interval: 30s
    input_series:
      - series: 'news_digest_job_duration_seconds_count{job="app-worker",queue="ingestion",name="collect",outcome="failed",trigger="scheduled"}'
        values: '2 2 3+0x24'
    alert_rule_test:
      - eval_time: 30s
        alertname: RecentJobFailures
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 1m
        alertname: RecentJobFailures
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 2m
        alertname: RecentJobFailures
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              queue: ingestion
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: Worker recorded failed attempts in the last ten minutes
      - eval_time: 12m
        alertname: RecentJobFailures
        groupname: app-outcomes
        exp_alerts: []
  - name: sustained API server errors
    interval: 30s
    input_series:
      - series: 'news_digest_http_request_duration_seconds_count{job="app-api",status="500"}'
        values: '0+2x10 20+0x20'
      - series: 'news_digest_http_request_duration_seconds_count{job="app-api",status="200"}'
        values: '0+18x10 180+20x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: ApiServerErrorRate
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 3m
        alertname: ApiServerErrorRate
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: API 5xx responses exceed five percent with at least twenty requests in five minutes
      - eval_time: 12m
        alertname: ApiServerErrorRate
        groupname: app-outcomes
        exp_alerts: []
  - name: low volume errors and client errors do not page
    interval: 30s
    input_series:
      - series: 'news_digest_http_request_duration_seconds_count{job="app-api",status="500"}'
        values: '0+0.1x20'
      - series: 'news_digest_http_request_duration_seconds_count{job="app-api",status="404"}'
        values: '0+0.2x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiServerErrorRate
        groupname: app-outcomes
        exp_alerts: []
  - name: five percent is below threshold
    interval: 30s
    input_series:
      - series: 'news_digest_http_request_duration_seconds_count{job="app-api",status="503"}'
        values: '0+1x20'
      - series: 'news_digest_http_request_duration_seconds_count{job="app-api",status="200"}'
        values: '0+19x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: ApiServerErrorRate
        groupname: app-outcomes
        exp_alerts: []
  - name: retained failure counter without new failures
    interval: 30s
    input_series:
      - series: 'news_digest_job_duration_seconds_count{job="app-worker",queue="ingestion",outcome="failed"}'
        values: '12+0x24'
    alert_rule_test:
      - eval_time: 5m
        alertname: RecentJobFailures
        groupname: app-outcomes
        exp_alerts: []
  - name: resetting a failure counter is not a new failure
    interval: 30s
    input_series:
      - series: 'news_digest_job_duration_seconds_count{job="app-worker",queue="ingestion",outcome="failed"}'
        values: '12+0x4 0+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: RecentJobFailures
        groupname: app-outcomes
        exp_alerts: []
  - name: service memory budget threshold duration recovery and isolation
    interval: 30s
    input_series:
      - series: 'news_digest_unit_memory_bytes{scope="system",unit="obs-grafana.service"}'
        values: '90 91+0x10 80'
      - series: 'news_digest_unit_memory_limit_bytes{scope="system",unit="obs-grafana.service"}'
        values: '100+0x12'
      - series: 'news_digest_unit_memory_bytes{scope="user",unit="news-digest-api.service"}'
        values: '99+0x12'
      - series: 'news_digest_unit_memory_limit_bytes{scope="user",unit="news-digest-api.service"}'
        values: '100+0x12'
      - series: 'news_digest_unit_memory_bytes{scope="system",unit="obs-node.service"}'
        values: '99+0x12'
      - series: 'news_digest_unit_memory_limit_bytes{scope="system",unit="obs-node.service"}'
        values: '0+0x12'
      - series: 'news_digest_unit_memory_bytes{scope="system",unit="obs-logs.service"}'
        values: '99+0x12'
    alert_rule_test:
      - eval_time: 0m
        alertname: ObservabilityMemoryBudget
        groupname: host-and-services
        exp_alerts: []
      - eval_time: 5m
        alertname: ObservabilityMemoryBudget
        groupname: host-and-services
        exp_alerts: []
      - eval_time: 5m30s
        alertname: ObservabilityMemoryBudget
        groupname: host-and-services
        exp_alerts:
          - exp_labels:
              scope: system
              unit: obs-grafana.service
              severity: warning
              alertgroup: host-and-services
            exp_annotations:
              summary: Observability service exceeds 90 percent of its configured memory ceiling
      - eval_time: 6m
        alertname: ObservabilityMemoryBudget
        groupname: host-and-services
        exp_alerts: []
  - name: scheduled lifecycle grace period hold and recovery
    interval: 30s
    input_series:
      - series: 'news_digest_schedule_unsettled_seconds{job="postgres"}'
        values: '0 900 901 930 960 990 1020 0'
    alert_rule_test:
      - eval_time: 30s
        alertname: ScheduledEditionUnsettled
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 2m30s
        alertname: ScheduledEditionUnsettled
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 3m
        alertname: ScheduledEditionUnsettled
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              job: postgres
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: Latest due scheduled lifecycle is unresolved or failed more than fifteen minutes after its scheduled time
      - eval_time: 3m30s
        alertname: ScheduledEditionUnsettled
        groupname: app-outcomes
        exp_alerts: []
  - name: absent scheduled lifecycle does not infer success or failure
    interval: 30s
    input_series: []
    alert_rule_test:
      - eval_time: 20m
        alertname: ScheduledEditionUnsettled
        groupname: app-outcomes
        exp_alerts: []
  - name: provider caps join by provider and period with threshold hold recovery
    interval: 30s
    input_series:
      - series: 'news_digest_provider_committed_usd{job="postgres",provider="anthropic",period="daily"}'
        values: '0.89 0.9+0x4 0.89'
      - series: 'news_digest_provider_configured_ceiling_usd{job="app-api",provider="anthropic",period="daily"}'
        values: '1+0x7'
      - series: 'news_digest_provider_configured_ceiling_usd{job="app-worker",provider="anthropic",period="daily"}'
        values: '1+0x7'
      - series: 'news_digest_provider_committed_usd{job="postgres",provider="xai",period="monthly"}'
        values: '8+0x7'
      - series: 'news_digest_provider_configured_ceiling_usd{provider="xai",period="monthly"}'
        values: '12+0x7'
      - series: 'news_digest_provider_committed_usd{provider="xai",period="daily"}'
        values: '1+0x7'
      - series: 'news_digest_provider_configured_ceiling_usd{provider="xai",period="daily"}'
        values: '0+0x7'
      - series: 'news_digest_provider_committed_usd{provider="unknown",period="daily"}'
        values: '9+0x7'
    alert_rule_test:
      - eval_time: 2m
        alertname: ProviderSpendNearCap
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 2m30s
        alertname: ProviderSpendNearCap
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              provider: anthropic
              period: daily
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: Provider UTC spend and outstanding holds reach 90 percent of the configured cap
      - eval_time: 3m
        alertname: ProviderSpendNearCap
        groupname: app-outcomes
        exp_alerts: []
  - name: digest missing schedule hold and recovery
    interval: 30s
    input_series:
      - series: 'news_digest_queue_schedulers{job="app-api",queue="digest-generation"}'
        values: '1 0 0 0 0 0 1'
      - series: 'news_digest_queue_schedulers{job="app-api",queue="social-collection"}'
        values: '1 0 0 0 0 0 1'
      - series: 'news_digest_queue_schedulers{job="app-worker",queue="digest-generation"}'
        values: '1 0 0 0 0 0 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: DigestScheduleUnavailable
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 2m30s
        alertname: DigestScheduleUnavailable
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              job: app-api
              queue: digest-generation
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: Daily digest queue has no registered schedule or is paused
      - eval_time: 3m
        alertname: DigestScheduleUnavailable
        groupname: app-outcomes
        exp_alerts: []
  - name: digest paused queue hold and recovery
    interval: 30s
    input_series:
      - series: 'news_digest_queue_paused{job="app-api",queue="digest-generation"}'
        values: '0 1 1 1 1 1 0'
      - series: 'news_digest_queue_paused{job="app-api",queue="social-collection"}'
        values: '0 1 1 1 1 1 0'
      - series: 'news_digest_queue_paused{job="app-worker",queue="digest-generation"}'
        values: '0 1 1 1 1 1 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: DigestScheduleUnavailable
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 2m30s
        alertname: DigestScheduleUnavailable
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              job: app-api
              queue: digest-generation
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: Daily digest queue has no registered schedule or is paused
      - eval_time: 3m
        alertname: DigestScheduleUnavailable
        groupname: app-outcomes
        exp_alerts: []
  - name: healthy daily digest and absent queue samples do not warn
    interval: 30s
    input_series:
      - series: 'news_digest_queue_schedulers{job="app-api",queue="digest-generation"}'
        values: '1+0x10'
      - series: 'news_digest_queue_paused{job="app-api",queue="digest-generation"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: DigestScheduleUnavailable
        groupname: app-outcomes
        exp_alerts: []
  - name: scrape outage belongs to scrape alert
    interval: 30s
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: DigestScheduleUnavailable
        groupname: app-outcomes
        exp_alerts: []
  - name: digest stalled schedule threshold hold and recovery
    interval: 30s
    input_series:
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",queue="digest-generation"}'
        values: '946684801+0x35 946694800'
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",queue="social-collection"}'
        values: '946684801+0x40'
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-worker",queue="digest-generation"}'
        values: '946684801+0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: DigestScheduleStalled
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 17m
        alertname: DigestScheduleStalled
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 17m30s
        alertname: DigestScheduleStalled
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              job: app-api
              queue: digest-generation
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: Daily digest scheduler next run remains more than fifteen minutes overdue
      - eval_time: 18m
        alertname: DigestScheduleStalled
        groupname: app-outcomes
        exp_alerts: []
  - name: future zero and absent scheduler times do not imply stall
    interval: 30s
    input_series:
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",queue="digest-generation"}'
        values: '946694800+0x40'
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",queue="social-collection"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: DigestScheduleStalled
        groupname: app-outcomes
        exp_alerts: []
  - name: zero digest scheduler time is invalid not overdue
    interval: 30s
    input_series:
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",queue="digest-generation"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: DigestScheduleStalled
        groupname: app-outcomes
        exp_alerts: []
  - name: absent digest scheduler time is not overdue
    interval: 30s
    input_series: []
    alert_rule_test:
      - eval_time: 20m
        alertname: DigestScheduleStalled
        groupname: app-outcomes
        exp_alerts: []
  - name: digest metrics missing schedulers
    interval: 30s
    input_series:
      - series: 'up{job="app-api",instance="api"}'
        values: '1+0x10'
      - series: 'news_digest_queue_paused{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 3m
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              job: app-api
              instance: api
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: API scrape succeeds but digest scheduling metrics are incomplete
  - name: digest metrics missing paused
    interval: 30s
    input_series:
      - series: 'up{job="app-api",instance="api"}'
        values: '1+0x10'
      - series: 'news_digest_queue_schedulers{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 3m
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              job: app-api
              instance: api
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: API scrape succeeds but digest scheduling metrics are incomplete
  - name: digest metrics missing next_scheduled_timestamp_seconds
    interval: 30s
    input_series:
      - series: 'up{job="app-api",instance="api"}'
        values: '1+0x10'
      - series: 'news_digest_queue_schedulers{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
      - series: 'news_digest_queue_paused{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 3m
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              job: app-api
              instance: api
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: API scrape succeeds but digest scheduling metrics are incomplete
  - name: digest metrics missing none
    interval: 30s
    input_series:
      - series: 'up{job="app-api",instance="api"}'
        values: '1+0x10'
      - series: 'news_digest_queue_schedulers{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
      - series: 'news_digest_queue_paused{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 3m
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts: []
  - name: digest metrics missing down
    interval: 30s
    input_series:
      - series: 'up{job="app-api",instance="api"}'
        values: '0+0x10'
      - series: 'news_digest_queue_schedulers{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
      - series: 'news_digest_queue_paused{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts: []
      - eval_time: 3m
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts: []
  - name: digest metrics recover and ignore unrelated exporter
    interval: 30s
    input_series:
      - series: 'up{job="app-api",instance="api"}'
        values: '1+0x12'
      - series: 'news_digest_queue_schedulers{job="app-api",instance="api",queue="digest-generation"}'
        values: '1+0x12'
      - series: 'news_digest_queue_paused{job="app-api",instance="api",queue="digest-generation"}'
        values: '0+0x12'
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-worker",instance="api",queue="digest-generation"}'
        values: '1+0x12'
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",instance="api",queue="social-collection"}'
        values: '1+0x12'
      - series: 'news_digest_queue_next_scheduled_timestamp_seconds{job="app-api",instance="api",queue="digest-generation"}'
        values: '_ _ _ _ _ _ _ _ 1+0x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts:
          - exp_labels:
              job: app-api
              instance: api
              severity: warning
              alertgroup: app-outcomes
            exp_annotations:
              summary: API scrape succeeds but digest scheduling metrics are incomplete
      - eval_time: 4m
        alertname: DigestScheduleMetricsMissing
        groupname: app-outcomes
        exp_alerts: []
