# Prepend to pg_hba.conf before broader trust rules; reload (no restart).
# Scope by role, not source address: Docker NAT changes the loopback peer IP.
# Existing rules continue to govern every other role. Keep the original file
# privately for rollback; this fragment does not enable LOGIN or grant access.
host all schema_catalog_reader 0.0.0.0/0 scram-sha-256
host all schema_catalog_reader ::/0 scram-sha-256
